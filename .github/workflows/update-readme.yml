name: update readme

on:
  schedule:
    - cron: "17 5 * * *"      # todo dia as 05:17 UTC (~02:17 em Brasilia)
  workflow_dispatch:           # botao para rodar na mao pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write              # necessario para o bot commitar os SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar os paineis
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python generate.py

      - name: Commitar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ cache/
          git diff --staged --quiet || git commit -m "chore: atualiza os paineis do readme"
          git push
